<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Esportivo — Contas</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --surface: #141719;
  --surface2: #1c1f23;
  --border: #252a2f;
  --accent: #00e5a0;
  --accent2: #00b37a;
  --warn: #f5c542;
  --danger: #e05252;
  --text: #e8eaed;
  --text2: #8b9199;
  --text3: #555d66;
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 14px; }

/* TOPBAR */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 52px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.brand { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .08em; flex: 1; }
.brand span { color: var(--text3); }
.user-pill { font-size: 12px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; }
.user-pill b { color: var(--text); }
.btn { cursor: pointer; font-family: var(--sans); font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn.danger-btn { border-color: var(--danger); color: var(--danger); }
.btn.danger-btn:hover { background: var(--danger); color: #fff; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; padding: 4px 6px; border-radius: 4px; transition: color .15s; }
.btn-icon:hover { color: var(--accent); }

/* STATS */
.stats-bar {
  display: flex; gap: 8px; padding: 14px 24px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; min-width: 140px; }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.stat-val { font-family: var(--mono); font-size: 18px; color: var(--accent); font-weight: 700; }
.stat-val.warn { color: var(--warn); }
.stat-val.danger { color: var(--danger); }

/* TOOLBAR */
.toolbar {
  display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  border-bottom: 1px solid var(--border);
}
.search-wrap { position: relative; flex: 1; max-width: 280px; }
.search-wrap input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 12px 7px 34px; border-radius: 6px;
  font-family: var(--sans); font-size: 13px; outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }
select.filter-sel {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  padding: 7px 10px; border-radius: 6px; font-family: var(--sans); font-size: 13px;
  outline: none; cursor: pointer;
}
select.filter-sel:focus { border-color: var(--accent); }

/* MAIN */
.main { padding: 20px 24px; }

/* GROUP */
.group-block { margin-bottom: 28px; }
.group-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.group-name { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.group-count { font-size: 11px; color: var(--text3); }
.group-add { font-size: 11px; color: var(--text3); cursor: pointer; margin-left: auto; }
.group-add:hover { color: var(--accent); }

/* TABLE */
.contas-table { width: 100%; border-collapse: collapse; }
.contas-table th {
  text-align: left; font-size: 11px; font-weight: 500;
  color: var(--text3); text-transform: uppercase; letter-spacing: .06em;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.contas-table th.sortable:hover { color: var(--text2); }
.contas-table th.sorted { color: var(--accent); }
.conta-row {
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  cursor: grab;
}
.conta-row:hover { background: var(--surface2); }
.conta-row.dragging { opacity: .4; }
.conta-row.drag-over { border-top: 2px solid var(--accent); }
.conta-row td { padding: 9px 10px; vertical-align: middle; }
.drag-handle { color: var(--text3); font-size: 14px; cursor: grab; user-select: none; }
.drag-handle:active { cursor: grabbing; }

/* Situação badge */
.badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; letter-spacing: .04em; text-transform: uppercase;
}
.badge.ativa { background: rgba(0,229,160,.12); color: var(--accent); border: 1px solid rgba(0,229,160,.25); }
.badge.acao { background: rgba(245,197,66,.12); color: var(--warn); border: 1px solid rgba(245,197,66,.25); }
.badge.inativa, .badge.limitada { background: rgba(224,82,82,.12); color: var(--danger); border: 1px solid rgba(224,82,82,.2); }

.saldo-val { font-family: var(--mono); font-size: 13px; }
.idade-saldo { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 1px; }
.idade-saldo.velho { color: var(--warn); }
.saldo-val.pos { color: var(--accent); }
.saldo-val.neg { color: var(--danger); }
.saldo-val.zero { color: var(--text3); }

.pwd-wrap { display: flex; align-items: center; gap: 6px; }
.pwd-dots { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: 2px; }
.eye-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; }
.eye-btn:hover { color: var(--accent); }
.copyable { transition: color 0.15s, background 0.15s; border-radius: 3px; padding: 2px 4px; }
.copyable:hover { color: var(--accent) !important; background: rgba(255,255,255,0.04); }
.copyable:active { background: rgba(255,255,255,0.1); }

.actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.conta-row:hover .actions { opacity: 1; }

/* EMPTY GROUP */
.empty-group { padding: 16px 10px; color: var(--text3); font-size: 13px; font-style: italic; }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.modal-title { font-family: var(--mono); font-size: 14px; color: var(--accent); margin-bottom: 20px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-row.single { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
.form-group input, .form-group select, .form-group textarea {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 6px; font-family: var(--sans); font-size: 13px; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 70px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* HIST MODAL */
.hist-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.hist-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; }
.hist-meta { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.hist-change { font-size: 13px; }
.hist-old { color: var(--danger); text-decoration: line-through; }
.hist-new { color: var(--accent); }

/* LOGIN */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: var(--bg);
}
.login-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 40px; width: 340px; text-align: center;
}
.login-brand { font-family: var(--mono); font-size: 15px; color: var(--accent); margin-bottom: 8px; letter-spacing: .08em; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
.login-box input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 10px 14px; border-radius: 6px; margin-bottom: 10px;
  font-family: var(--sans); font-size: 14px; outline: none; text-align: left;
}
.login-box input:focus { border-color: var(--accent); }
.login-err { color: var(--danger); font-size: 12px; margin-bottom: 8px; min-height: 16px; }
#app-screen { display: none; }

/* CLICKABLE STATS */
.stat-clickable { cursor: pointer; transition: all .15s; }
.stat-clickable:hover { border-color: var(--text2); }
.stat-clickable.active { border-color: var(--accent) !important; }
#card-ativa.active  { border-color: var(--accent) !important; background: rgba(0,229,160,.08); }
#card-acao.active   { border-color: var(--warn) !important; background: rgba(245,197,66,.08); }
#card-inativa.active { border-color: var(--danger) !important; background: rgba(224,82,82,.08); }
#card-todas.active  { border-color: var(--text2) !important; }

/* GROUP PILLS (inline in stats bar) */
.grp-pill {
  cursor: pointer; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; transition: all .15s;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-width: 90px; max-width: 170px;
  position: relative;
}
.grp-pill[draggable="true"] { cursor: grab; }
.grp-pill[draggable="true"]:active { cursor: grabbing; }
.grp-pill:hover { border-color: var(--text2); }
.grp-pill.active { border-color: var(--accent); background: rgba(0,229,160,.08); }
.grp-pill-sem { border-style: dashed; }
.grp-pill-label { font-size: 10px; line-height: 1.35; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; font-family: var(--mono); white-space: normal; }
.grp-pill-count { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text); }
.grp-pill.active .grp-pill-count { color: var(--accent); }
.grp-pill.active .grp-pill-label { color: var(--accent2); }
.grp-pill-x {
  position: absolute; top: 4px; right: 4px;
  width: 16px; height: 16px; border-radius: 4px;
  display: none; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; color: var(--text3);
  background: var(--surface3, rgba(255,255,255,0.05));
  cursor: pointer;
}
.grp-pill:hover .grp-pill-x { display: flex; }
.grp-pill-x:hover { background: var(--danger, #e85a6e); color: #fff; }
.grp-pill-add {
  align-items: center; justify-content: center;
  font-size: 22px; color: var(--text3);
  min-width: 50px; min-height: 100%;
  border-style: dashed;
}
.grp-pill-add:hover { color: var(--accent); border-color: var(--accent); }

/* SIT FILTER BUTTONS */
.sit-filters { display:flex; gap:6px; align-items:center; }
.sit-btn {
  cursor:pointer; font-family:var(--sans); font-size:12px; font-weight:600;
  padding:5px 12px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text3); transition:all .15s; letter-spacing:.02em;
}
.sit-btn.active-filter { border-color: var(--text2); color: var(--text); }
.sit-btn.sit-ativa.active-filter { background:rgba(0,229,160,.15); border-color:var(--accent); color:var(--accent); }
.sit-btn.sit-acao.active-filter  { background:rgba(245,197,66,.15); border-color:var(--warn); color:var(--warn); }
.sit-btn.sit-inativa.active-filter { background:rgba(224,82,82,.15); border-color:var(--danger); color:var(--danger); }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 999;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 18px; font-size: 13px; color: var(--text);
  transform: translateY(80px); opacity: 0; transition: all .25s;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok { border-color: var(--accent); color: var(--accent); }
.toast.err { border-color: var(--danger); color: var(--danger); }

/* GRUPO RENAME INPUT */
.group-name-input {
  background: none; border: none; border-bottom: 1px solid var(--accent);
  color: var(--accent); font-family: var(--mono); font-size: 11px;
  letter-spacing: .1em; text-transform: uppercase; outline: none; width: 160px;
}

/* ABAS */
.tabs { display: flex; gap: 4px; }
.tab { background: none; border: 1px solid transparent; color: var(--text2); font: 500 13px var(--sans); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); background: var(--surface2); border-color: var(--border); }
.tab:focus-visible, .op-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* TURNO */
.btn.turno { border-color: var(--accent); color: var(--accent); }
.btn.turno:hover { background: var(--accent); color: #000; }
.btn.turno.on { border-color: var(--warn); color: var(--warn); }
.btn.turno.on:hover { background: var(--warn); color: #000; }
.btn.turno:disabled { opacity: .6; cursor: wait; }
.pend-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 24px; font-size: 13px; color: var(--warn); background: rgba(245,197,66,.07); border-bottom: 1px solid rgba(245,197,66,.25); }
.pend-bar[hidden] { display: none; }
.pend-bar b { font-weight: 600; }

/* OPERAÇÃO */
.op-wrap { padding: 20px 24px 48px; max-width: 1180px; }
.op-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.op-periodo { font-family: var(--mono); font-size: 14px; color: var(--text); min-width: 210px; text-align: center; }
.op-btn { cursor: pointer; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font: 500 13px var(--sans); padding: 6px 12px; border-radius: 6px; }
.op-btn:hover { border-color: var(--accent); color: var(--accent); }
.op-btn.on { color: var(--accent); border-color: var(--accent); }
.op-btn.perigo:hover { border-color: var(--danger); color: var(--danger); }
.op-seg { display: inline-flex; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
.op-seg .op-btn { border: none; background: none; padding: 5px 10px; }
.op-seg .op-btn.on { background: var(--surface); }
.op-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 8px; }
.op-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.op-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.op-nome { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.op-aberto { font-size: 11px; color: var(--warn); border: 1px solid rgba(245,197,66,.35); border-radius: 20px; padding: 2px 8px; }
.op-horas { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--text); }
.op-horas small { font-size: 12px; font-weight: 400; color: var(--text2); }
.op-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
.op-bar > div { height: 100%; background: var(--accent); }
.op-linha { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); }
.op-linha span:first-child { color: var(--text2); }
.op-linha b { font-family: var(--mono); font-weight: 400; text-align: right; }
.op-linha.total b { color: var(--accent); font-weight: 700; }
.op-pend { color: var(--warn); }
.op-sec { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); margin: 26px 0 10px; }
.op-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.op-table th { text-align: left; font-weight: 500; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; border-bottom: 1px solid var(--border); }
.op-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.op-table tr:last-child td { border-bottom: none; }
.op-table .mono { font-family: var(--mono); font-size: 12px; }
.op-vazio { color: var(--text3); font-size: 13px; padding: 14px 0; }
.op-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
.op-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text3); }
.op-form input, .op-form select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 9px; font: 13px var(--sans); }
.op-form input[type=number] { width: 78px; }
.op-form input:focus, .op-form select:focus { border-color: var(--accent); outline: none; }
.op-acoes { display: flex; gap: 6px; justify-content: flex-end; }
.op-flag { font-size: 11px; color: var(--warn); }
@media (max-width: 640px) {
  .op-wrap { padding: 16px; }
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 16px; gap: 8px; }
  .op-table { display: block; overflow-x: auto; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">RM / MERCADO ESPORTIVO</div>
    <div class="login-sub">Dashboard de Contas</div>
    <input id="l-user" placeholder="Usuário" autocomplete="off">
    <input id="l-pass" type="password" placeholder="Senha">
    <div class="login-err" id="l-err"></div>
    <button class="btn primary" style="width:100%;padding:10px" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="brand">RM <span>/</span> MERCADO ESPORTIVO</div>
    <nav class="tabs" aria-label="Seções">
      <button class="tab active" data-view="contas" onclick="setView('contas')">Contas</button>
      <button class="tab" data-view="operacao" onclick="setView('operacao')">Operação</button>
    </nav>
    <button class="btn turno" id="btn-turno" hidden onclick="turnoClick()">Iniciar turno</button>
    <div class="user-pill">usuário: <b id="disp-user"></b></div>
    <button class="btn primary" id="btn-nova-conta" onclick="openModal()">+ Nova Conta</button>
    <button class="btn" onclick="doLogout()">Sair</button>
  </div>
  <div class="pend-bar" id="pend-bar" hidden role="status"></div>

  <div id="view-contas">
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label" id="st-saldo-label">Saldo Real</div>
      <div class="stat-val" id="st-saldo">—</div>
      <div id="st-saldo-sub" style="font-size:11px;color:var(--text3);margin-top:3px">—</div>
      <div id="st-saldo-usd" style="font-size:11px;color:var(--text3);margin-top:2px;display:none"></div>
    </div>
    <div class="stat stat-clickable" id="card-todas" onclick="setSitFilter('','todas')" title="Ver todas">
      <div class="stat-label">Total</div>
      <div class="stat-val" id="st-total">—</div>
    </div>
    <div class="stat stat-clickable" id="card-ativa" onclick="setSitFilter('ativa','card-ativa')" title="Filtrar Ativas">
      <div class="stat-label">Ativas</div>
      <div class="stat-val" id="st-ativas">—</div>
    </div>
    <div class="stat stat-clickable" id="card-acao" onclick="setSitFilter('acao','card-acao')" title="Filtrar Ação">
      <div class="stat-label">⚠ Ação</div>
      <div class="stat-val warn" id="st-acao">—</div>
    </div>
    <div class="stat stat-clickable" id="card-inativa" onclick="setSitFilter('inativa','card-inativa')" title="Filtrar Inativas">
      <div class="stat-label">Inativas</div>
      <div class="stat-val danger" id="st-inativas">—</div>
    </div>
    <div style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></div>
    <div id="group-pills-bar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
  </div>


  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>

function sortInd(col) { return sortCol === col ? (sortDir === 1 ? ' ↑' : ' ↓') : ''; }

function renderGrpPills() {
  const bar = document.getElementById('group-pills-bar');
  if (!bar) return;
  const js = s => esc(s).replace(/'/g,"\\'");

  const pills = grupos.map(g => {
    const cnt = allContas.filter(x=>x.grupo===g).length;
    const isActive = activeGrpFilter === g;
    return `<div class="grp-pill${isActive?' active':''}"
              draggable="true"
              data-grupo="${esc(g)}"
              ondragstart="grpDragStart(event, '${js(g)}')"
              ondragover="event.preventDefault()"
              ondrop="grpDrop(event, '${js(g)}')"
              ondblclick="grpEditNome('${js(g)}')"
              onclick="if(!event.target.closest('.grp-pill-x')) setGrpFilter('${js(g)}')">

    </div>`;
  });

  // Pill virtual das contas sem grupo — só aparece quando tem alguma
  const semCnt = allContas.filter(c => grupoDe(c) === SEM_GRUPO).length;
  if (!semCnt && activeGrpFilter === SEM_GRUPO) activeGrpFilter = '';
  if (semCnt) pills.push(`<div class="grp-pill grp-pill-sem${activeGrpFilter===SEM_GRUPO?' active':''}" onclick="setGrpFilter('${SEM_GRUPO}')" title="Contas sem grupo. Pra pôr num grupo: ✏️ na conta e escolha o grupo">
      <div class="grp-pill-label">Sem grupo</div>

    </div>`);

  bar.innerHTML = pills.join('') + `<div class="grp-pill grp-pill-add" onclick="grpAddInline()" title="Adicionar grupo">+</div>`;
}

let grpDragSrcName = null;
function grpDragStart(e, nome) {
  grpDragSrcName = nome;
  e.dataTransfer.effectAllowed = 'move';
}
async function grpDrop(e, targetNome) {
  e.preventDefault();
  if (!grpDragSrcName || grpDragSrcName === targetNome) return;
  const srcIdx = grupos.indexOf(grpDragSrcName);
  const tgtIdx = grupos.indexOf(targetNome);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = grupos.splice(srcIdx, 1);
  grupos.splice(tgtIdx, 0, moved);
  grpDragSrcName = null;
  renderGrpPills();
  await saveGruposOrdem();
}

async function grpEditNome(atual) {
  const novo = prompt(`Renomear "${atual}":`, atual);
  if (!novo || novo.trim() === '' || novo.trim() === atual) return;
  const novoNome = novo.trim();
  if (mesmoNome(novoNome, SEM_GRUPO)) { toast('"Sem grupo" é reservado', 'err'); return; }
  if (grupos.some(g => g !== atual && mesmoNome(g, novoNome))) { toast('Já existe um grupo com esse nome', 'err'); return; }
  try {
    // 1. Atualiza nome do grupo na tabela grupos_contas
    const grupoId = _gruposIdMap[atual];
    if (grupoId) await sbPatch(`grupos_contas?id=eq.${grupoId}`, { nome: novoNome });
    _gruposIdMap[novoNome] = grupoId;
    delete _gruposIdMap[atual];

    // 2. Atualiza referências nas contas (um PATCH só)
    await sbPatch(`contas?grupo=eq.${encodeURIComponent(atual)}`, { grupo: novoNome });
    allContas.forEach(c => { if (c.grupo === atual) c.grupo = novoNome; });

    const idx = grupos.indexOf(atual);
    if (idx >= 0) grupos[idx] = novoNome;
    if (activeGrpFilter === atual) activeGrpFilter = novoNome;
    renderGrpPills(); renderGroups();
    populateGrupoSelectInModal();
    toast('Grupo renomeado', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

// Apagar grupo nunca apaga conta: as contas vão pra Sem grupo (e ficam no histórico de cada uma)
async function grpRemove(g) {
  const afetadas = allContas.filter(c => c.grupo === g);
  const cnt = afetadas.length;
  const comSaldo = afetadas.filter(c => (parseFloat(c.saldo)||0) !== 0);
  const saldoR = somaSaldo(comSaldo.filter(c => !isUsd(c)));
  const saldoD = somaSaldo(comSaldo.filter(isUsd));
  const saldoTxt = [saldoR ? brl(saldoR) : '', saldoD ? usd(saldoD) : ''].filter(Boolean).join(' · ');
  const msg = cnt > 0
    ? `Apagar o grupo "${g}"?\n\nAs ${cnt} conta${cnt!==1?'s':''} vão pra Sem grupo`
      + (comSaldo.length ? ` (${comSaldo.length} com saldo, ${saldoTxt})` : '')
      + `.\nNenhuma conta é apagada.`
    : `Apagar o grupo "${g}"?`;
  if (!confirm(msg)) return;
  try {
    // 1. Contas vão pra Sem grupo (um PATCH só)
    if (cnt) {
      await sbPatch(`contas?grupo=eq.${encodeURIComponent(g)}`, { grupo: SEM_GRUPO });
      afetadas.forEach(c => c.grupo = SEM_GRUPO);
      try {
        await sbPost('historico_contas', afetadas.map(c => ({
          conta_id: c.id, campo_alterado: 'grupo',
          valor_anterior: g, valor_novo: SEM_GRUPO, alterado_por: currentUser
        })));
      } catch(e) { console.error('Histórico da remoção de grupo:', e); }
    }
    // 2. Apaga o registro do grupo
    const grupoId = _gruposIdMap[g];
    if (grupoId) await sbDelete(`grupos_contas?id=eq.${grupoId}`);
    delete _gruposIdMap[g];

    grupos = grupos.filter(x => x !== g);
    if (activeGrpFilter === g) activeGrpFilter = '';
    renderGrpPills(); renderGroups();
    populateGrupoSelectInModal();
    toast('Grupo apagado', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

async function grpAddInline() {
  const nome = prompt('Nome do novo grupo:');
  if (!nome || !nome.trim()) return;
  const v = nome.trim();
  if (mesmoNome(v, SEM_GRUPO)) { toast('"Sem grupo" é reservado', 'err'); return; }
  if (grupos.some(g => mesmoNome(g, v))) { toast('Grupo já existe', 'err'); return; }
  try {
    const inserted = await sbPostReturn('grupos_contas', { nome: v, ordem: grupos.length + 1 });
    if (inserted && inserted[0]) _gruposIdMap[v] = inserted[0].id;
    grupos.push(v);

    // Contas que já tinham esse nome de grupo (ex.: grupo apagado e recriado) entram nele sozinhas
    renderGrpPills(); renderGroups();
    populateGrupoSelectInModal();
    toast('Grupo adicionado', 'ok');
    await saveGruposOrdem(); // renumera 1..n pra ordem do banco bater com a da tela
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

// ── STORAGE DE GRUPOS ──────────────────────────────────────────
// ── GRUPOS: CRUD via Supabase ──────────────────────────────────
// Os grupos ficam na tabela grupos_contas (id, nome, ordem). Antes ficavam em localStorage,
// o que causava cada navegador ter sua própria versão. Agora todo mundo vê o mesmo.
let _gruposIdMap = {}; // nome -> id (pra updates/deletes)

async function loadGrupos() {
  // Limpa lixo de versão antiga (grupos no localStorage). Agora vem do Supabase.
  try { localStorage.removeItem('me_grupos'); } catch(e) {}

  try {
    const rows = await sbGet('grupos_contas?select=id,nome,ordem&order=ordem');
    grupos = rows.map(r => r.nome);
    _gruposIdMap = Object.fromEntries(rows.map(r => [r.nome, r.id]));
  } catch(e) {
    console.error('Erro loadGrupos:', e);
    grupos = [];
    _gruposIdMap = {};
  }
  // OUTRAS BOOKIES deixou de ser obrigatório: não é mais recriado ao carregar.
}

// Salvar ordem completa (chamado depois de drag-and-drop)
async function saveGruposOrdem() {
  // Re-grava ordem de cada grupo conforme posição no array
  for (let i = 0; i < grupos.length; i++) {
    const nome = grupos[i];
    const id = _gruposIdMap[nome];
    if (!id) continue;
    const novaOrdem = i + 1;
    try {
      await sbPatch(`grupos_contas?id=eq.${id}`, { ordem: novaOrdem });
    } catch(e) { console.error('Erro salvando ordem:', e); }
  }
}

// ── API ─────────────────────────────────────────────────────────
const headers = (write=false) => ({
  'Content-Type':'application/json',
  'apikey': write ? SVC_KEY : ANON_KEY,
  'Authorization': `Bearer ${write ? SVC_KEY : ANON_KEY}`,
  ...(write ? {'Prefer':'return=minimal'} : {})
});
async function sbGet(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: headers() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbRpc(fn, body={}) {
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers: headers(), body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(path, body) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method:'PATCH', headers: headers(true), body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
}
async function sbPost(path, body) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method:'POST', headers: headers(true), body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
}
async function sbPostReturn(path, body) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method:'POST', headers: { ...headers(true), 'Prefer': 'return=representation' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method:'DELETE', headers: headers(true) });
  if (!r.ok) throw new Error(await r.text());
}

// ── STATS ───────────────────────────────────────────────────────
function brl(v) { return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// Saldo na moeda da conta. R$ e US$ nunca se somam: cada total sai separado.
function usd(v) { return 'US$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function isUsd(c) { return c.moeda === 'USD'; }
function fmtSaldo(c) { return isUsd(c) ? usd(c.saldo) : brl(c.saldo); }
function somaSaldo(list) { return list.reduce((a,c)=>a+(parseFloat(c.saldo)||0),0); }
function normSit(s) { return (s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function isInativa(s) { const n=normSit(s); return n.includes('INATIVA') || n.includes('LIMITADA'); }
function updateStats(list) {
  const src = list || allContas;
  const ativas   = src.filter(c => normSit(c.situacao) === 'ATIVA');
  const acao     = src.filter(c => { const n=normSit(c.situacao); return !n.includes('INATIVA') && !n.includes('LIMITADA') && n !== 'ATIVA'; });
  const inativas = src.filter(c => isInativa(c.situacao));
  const saldo    = somaSaldo(src.filter(c => !isUsd(c)));   // R$ só de contas em real
  const saldoUsd = somaSaldo(src.filter(isUsd));             // US$ separado, nunca somado ao R$
  const temUsd   = src.some(isUsd);
  const pd       = window._pendData || {total:{r:0,u:0,usd:0}, bookies:[]};
  const subEl    = document.getElementById('st-saldo-sub');
  const usdEl    = document.getElementById('st-saldo-usd');
  const labelEl  = document.getElementById('st-saldo-label');
  let pend = 0, pendUsd = 0, mostrar = false;
  if (activeGrpFilter) {
    // pendente das casas (bookies) desse grupo — nomes normalizados (contas em MAIÚSC, apostas em Title)
    const casas = new Set(allContas.filter(c => grupoDe(c) === activeGrpFilter).map(c => normSit(c.casa)));
    const doGrupo = pd.bookies.filter(x => casas.has(normSit(x.b)));
    pend    = doGrupo.reduce((s,x)=>s+(parseFloat(x.r)||0),0);
    pendUsd = doGrupo.reduce((s,x)=>s+(parseFloat(x.usd)||0),0);
    mostrar = true;
  } else if (!activeSitFilter) {
    pend    = parseFloat(pd.total?.r)||0;
    pendUsd = parseFloat(pd.total?.usd)||0;
    mostrar = true;
  }
  if (mostrar) {
    document.getElementById('st-saldo').textContent = brl(saldo + pend);
    if (labelEl) labelEl.textContent = 'Saldo Real';
    if (subEl) { subEl.style.display = ''; subEl.textContent = brl(saldo) + ' disponível · ' + brl(pend) + ' pendente'; }
  } else {
    document.getElementById('st-saldo').textContent = brl(saldo);
    if (labelEl) labelEl.textContent = 'Saldo Total';
    if (subEl) { subEl.style.display = 'none'; subEl.textContent = ''; }
  }
  // Linha em dólar: só aparece se o filtro tem conta em US$ ou aposta em US$ pendente
  if (usdEl) {
    const pu = mostrar ? pendUsd : 0;
    if (temUsd || pu) {
      usdEl.style.display = '';
      usdEl.innerHTML = `<b>${usd(saldoUsd + pu)}</b>` + (mostrar ? ` · ${usd(saldoUsd)} disponível · ${usd(pu)} pendente` : '');
    } else { usdEl.style.display = 'none'; usdEl.textContent = ''; }
  }
  document.getElementById('st-ativas').textContent   = ativas.length;
  document.getElementById('st-acao').textContent     = acao.length;
  document.getElementById('st-inativas').textContent = inativas.length;
  document.getElementById('st-total').textContent    = src.length;
}

// ── RENDER ───────────────────────────────────────────────────────
function renderGroups() {
  const search = document.getElementById('search-input').value.toLowerCase();
  // sit filter handled by activeSitFilter
  const filGrp = activeGrpFilter;

  let contas = allContas.filter(c => {
    const matchSearch = !search || [c.casa,c.agente,c.login].some(v=>(v||'').toLowerCase().includes(search));
    const matchSit    = !activeSitFilter || badgeClass(c.situacao) === activeSitFilter;
    const matchGrp    = !filGrp || grupoDe(c) === filGrp;
    return matchSearch && matchSit && matchGrp;
  });

  // Determine which groups to show
  let allGrps;
  if (filGrp) {
    allGrps = [filGrp];
  } else {
    // Show all groups that have matching accounts, em ordem da lista de grupos do Supabase
    const grpsInData = new Set(contas.map(c => grupoDe(c)));
    allGrps = grupos.filter(g => grpsInData.has(g));
    // Add any extra groups not in current list
    [...grpsInData].filter(g => !grupos.includes(g)).forEach(g => allGrps.push(g));
  }

  const main = document.getElementById('main-content');
  main.innerHTML = '';
  updateStats(contas);

  const tableHeader = `<thead><tr>
    <th style="width:28px"></th>
    ${thSort('casa','Casa')}
    ${thSort('agente','Agente')}
    <th>Login</th>
    <th>Senha</th>
    ${thSort('saldo','Saldo')}
    ${thSort('situacao','Situação')}
    ${thSort('observacoes','Obs')}
    <th></th>
  </tr></thead>`;

  function sortContas(list) {
    if (!sortCol) return list;
    const cmp = (x,y) => x>y ? 1 : x<y ? -1 : 0;
    const norm = v => String(v||'').toLowerCase();
    return [...list].sort((a,b) => {
      let av = a[sortCol]||'', bv = b[sortCol]||'';
      if (sortCol==='saldo') {
        // R$ e US$ não se comparam: contas em real primeiro, depois as em dólar, cada bloco ordenado pelo valor
        const m = cmp(isUsd(a)?1:0, isUsd(b)?1:0);
        if (m) return m;
        av=parseFloat(av)||0; bv=parseFloat(bv)||0;
      }
      else { av=norm(av); bv=norm(bv); }
      const r = cmp(av,bv);
      if (r) return r*sortDir;
      // desempate estável: casa → agente → login (sempre asc)
      return cmp(norm(a.casa),norm(b.casa)) || cmp(norm(a.agente),norm(b.agente)) || cmp(norm(a.login),norm(b.login));
    });
  }

  if (!filGrp) {
    // Flat list — sem cabeçalho de grupo
    const sorted = sortContas(contas);
    const block = document.createElement('div');
    block.className = 'group-block';
    block.innerHTML = `<table class="contas-table">${tableHeader}<tbody id="tbody-flat"></tbody></table>`;
    main.appendChild(block);
    const tbody = block.querySelector('tbody');
    sorted.forEach(c => tbody.appendChild(makeRow(c)));
    setupDrop(tbody);
  } else {
    // Por grupo — mostra cabeçalho
    allGrps.forEach(grp => {
      let grpContas = sortContas(contas.filter(c=>grupoDe(c)===grp));
      if (!grpContas.length) return;

      const block = document.createElement('div');
      block.className = 'group-block';
      block.dataset.grupo = grp;
      block.innerHTML = `
        <div class="group-header">
          <span class="group-name">${esc(grp)}</span>
          <span class="group-count">${grpContas.length} conta${grpContas.length!==1?'s':''}</span>
        </div>
        <table class="contas-table">${tableHeader}<tbody id="tbody-${grp.replace(/\s+/g,'_')}"></tbody></table>`;
      main.appendChild(block);

      const tbody = block.querySelector('tbody');
      grpContas.forEach(c => tbody.appendChild(makeRow(c)));
      setupDrop(tbody);
    });
  }
}

// Idade do saldo: última alteração de saldo no histórico (fallback: criação da conta).
// Neutra por padrão — só ganha cor (amarelo suave) em conta ATIVA com 30+ dias.
// Extrai {ts, por} do mapa de idades (aceita formato novo e antigo)
function _idadeInfo(mapa, id) {
  const raw = (mapa || {})[id];
  if (!raw) return null;
  if (typeof raw === 'string') return { ts: raw, por: null };
  return { ts: raw.ts, por: raw.por || null };
}
function _idadeTexto(ts, por) {
  const d = new Date(ts);
  const dias = Math.floor((Date.now() - d.getTime()) / 86400000);
  const hora = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const idade = dias <= 0 ? `hoje ${hora}` : (dias === 1 ? 'há 1d' : `há ${dias}d`);
  const quem = por ? ` · ${por}` : '';
  const title = `${d.toLocaleDateString('pt-BR')} ${hora}${por ? ' · por ' + por : ''}`;
  return { texto: idade + quem, title, dias };
}

function idadeSaldoHtml(c) {
  const info = _idadeInfo(window._idadeSaldos, c.id);
  if (!info) return '';
  const { texto, title, dias } = _idadeTexto(info.ts, info.por);
  const velho = dias >= 30 && badgeClass(c.situacao) === 'ativa';
  return `<div class="idade-saldo${velho ? ' velho' : ''}" title="Saldo atualizado em ${title}">${texto}</div>`;
}

// Situações transitórias: exigem ação e não deviam envelhecer
const SIT_TRANSITORIAS = ['FACIAL','EMAIL','DEPOSITAR','REDEFINIR SENHA','SEM SALDO','LIMITADA'];
function idadeSituacaoHtml(c) {
  const info = _idadeInfo(window._idadeSituacoes, c.id);
  if (!info) return '';
  const { texto, title, dias } = _idadeTexto(info.ts, info.por);
  const parada = dias >= 2 && SIT_TRANSITORIAS.includes((c.situacao || '').toUpperCase());
  return `<div class="idade-saldo${parada ? ' velho' : ''}" title="Situação desde ${title}">${texto}</div>`;
}

function badgeClass(s) {
  const n = normSit(s);
  if (n.includes('INATIVA') || n.includes('LIMITADA')) return 'inativa';
  if (n === 'ATIVA') return 'ativa';
  return 'acao'; // tudo mais = ação necessária (amarelo)
}
function badgeLabel(s) { return s || '—'; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function makeRow(c) {
  const tr = document.createElement('tr');
  tr.className = 'conta-row';
  tr.dataset.id = c.id;
  // Reordenar só dentro de um grupo filtrado. Na visão "Todas" arrastar jogava a conta em Sem Grupo.
  const podeArrastar = !!activeGrpFilter;
  tr.draggable = podeArrastar;

  const sval = parseFloat(c.saldo)||0;
  const scls = sval > 0 ? 'pos' : sval < 0 ? 'neg' : 'zero';

  tr.innerHTML = `
    <td><span class="drag-handle" ${podeArrastar ? 'title="Arrastar"' : 'title="Filtre um grupo pra reordenar" style="opacity:.25;cursor:default"'}>⠿</span></td>
    <td><b>${esc(c.casa)}</b></td>
    <td style="color:var(--text2)">${esc(c.agente||'')}</td>
    <td><span class="copyable" style="color:var(--text2);font-family:var(--mono);font-size:12px;cursor:pointer" title="Clique para copiar" onclick="copyTxt(event, ${JSON.stringify(c.login||'').replace(/"/g,'&quot;')})">${esc(c.login||'')}</span></td>
    <td>
      <div class="pwd-wrap">
        <span class="pwd-dots copyable" id="pwd-${c.id}" style="cursor:pointer" title="Clique para copiar" onclick="copyTxt(event, ${JSON.stringify(c.senha||'').replace(/"/g,'&quot;')})">••••••</span>
        <button class="eye-btn" onclick="togglePwd('${c.id}','${esc(c.senha||'')}')">👁</button>
      </div>
    </td>
    <td><span class="saldo-val ${scls}" style="cursor:pointer" title="Clique para editar" onclick="editSaldo(this,'${c.id}',${sval})">${fmtSaldo(c)}</span>${idadeSaldoHtml(c)}</td>
    <td><span class="badge ${badgeClass(c.situacao)}" style="cursor:pointer" title="Clique para editar" onclick="editSituacao(this,'${c.id}','${esc(c.situacao||'')}')">${badgeLabel(c.situacao)}</span>${idadeSituacaoHtml(c)}</td>
    <td class="obs-cell" style="color:var(--text3);font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" title="Clique para editar" data-id="${c.id}" data-obs="${esc(c.observacoes||'')}"><span>${esc(c.observacoes||'')}</span></td>
    <td>
      <div class="actions">
        <button class="btn-icon" title="Editar" onclick="editConta('${c.id}')">✏️</button>
        <button class="btn-icon" title="Histórico" onclick="showHist('${c.id}','${esc(c.casa)}')">📋</button>
        <button class="btn-icon" title="Excluir" onclick="confirmDelete('${c.id}','${esc(c.casa)}')">🗑</button>
      </div>
    </td>`;

  // Drag events
  tr.addEventListener('dragstart', e => { dragSrc = tr; tr.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  tr.addEventListener('dragend', () => { tr.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); });
  tr.addEventListener('dragover', e => { e.preventDefault(); tr.classList.add('drag-over'); });
  tr.addEventListener('dragleave', () => tr.classList.remove('drag-over'));
  tr.addEventListener('drop', e => { e.preventDefault(); handleDrop(tr); });

  // obs inline edit via delegation
  const obsTd = tr.querySelector('.obs-cell');
  if (obsTd) {
    obsTd.addEventListener('click', () => {
      editObs(obsTd, obsTd.dataset.id, obsTd.dataset.obs || '');
    });
  }

  return tr;
}

// ── DRAG & DROP ─────────────────────────────────────────────────
function setupDrop(tbody) {
  tbody.addEventListener('dragover', e => e.preventDefault());
  tbody.addEventListener('drop', e => {
    e.preventDefault();
    if (dragSrc && tbody !== dragSrc.closest('tbody')) {
      // Drop onto empty tbody
      const newGrp = tbody.closest('.group-block')?.dataset.grupo;
      if (newGrp) handleDropToGroup(newGrp);
    }
  });
}

async function handleDrop(targetRow) {
  if (!dragSrc || dragSrc === targetRow) return;
  const newGrp = targetRow.closest('.group-block')?.dataset.grupo;
  if (!newGrp) return; // visão "Todas": arrastar não troca grupo
  const srcId  = dragSrc.dataset.id;
  const tgtId  = targetRow.dataset.id;

  // Troca de grupo só se a conta estiver de fato em outro grupo
  const srcConta = allContas.find(c=>c.id===srcId);
  if (!srcConta) return;
  const grupoAntes = grupoDe(srcConta);
  if (grupoAntes !== newGrp) srcConta.grupo = newGrp;

  // Reorder within group: insert srcConta before targetConta
  const grpContas = allContas.filter(c=>grupoDe(c)===newGrp);
  const others    = allContas.filter(c=>grupoDe(c)!==newGrp);

  const srcIdx = grpContas.findIndex(c=>c.id===srcId);
  const tgtIdx = grpContas.findIndex(c=>c.id===tgtId);

  // Remove src from original position
  const [moved] = srcIdx>=0 ? grpContas.splice(srcIdx,1) : [srcConta];
  // Find new tgt idx after removal
  const newTgtIdx = grpContas.findIndex(c=>c.id===tgtId);
  grpContas.splice(newTgtIdx>=0 ? newTgtIdx : grpContas.length, 0, moved);

  // Reassign ordem
  grpContas.forEach((c,i) => c.ordem = i);
  allContas.length = 0;
  allContas.push(...others, ...grpContas);

  renderGroups();
  await saveOrdem(grpContas, srcId, grupoAntes !== newGrp ? grupoAntes : null);
}

async function handleDropToGroup(newGrp) {
  if (!dragSrc) return;
  const srcId   = dragSrc.dataset.id;
  const srcConta = allContas.find(c=>c.id===srcId);
  if (!srcConta || grupoDe(srcConta) === newGrp) return;
  const grupoAntes = grupoDe(srcConta);
  srcConta.grupo = newGrp;
  renderGroups();
  await saveOrdem([srcConta], srcId, grupoAntes);
}

// grupoAnterior só vem preenchido quando a conta trocou de grupo — reordenar não gera histórico
async function saveOrdem(grpContas, mainId, grupoAnterior) {
  try {
    for (const c of grpContas) {
      await sbPatch(`contas?id=eq.${c.id}`, { ordem: c.ordem, grupo: c.grupo || SEM_GRUPO });
    }
    const srcConta = allContas.find(c=>c.id===mainId);
    if (srcConta && grupoAnterior) {
      await sbPost('historico_contas', {
        conta_id: mainId, campo_alterado: 'grupo',
        valor_anterior: grupoAnterior, valor_novo: srcConta.grupo,
        alterado_por: currentUser
      });
    }
  } catch(e) { toast('Erro ao salvar ordem: ' + e.message, 'err'); }
}

function openModal(conta=null) {
  document.getElementById('modal-title').textContent = conta ? 'EDITAR CONTA' : 'NOVA CONTA';
  document.getElementById('f-id').value       = conta?.id || '';
  document.getElementById('f-casa').value     = conta?.casa || '';
  document.getElementById('f-agente').value   = conta?.agente || '';
  document.getElementById('f-situacao').value = conta?.situacao || 'ATIVA';
  document.getElementById('f-login').value    = conta?.login || '';
  document.getElementById('f-senha').value    = conta?.senha || '';
  document.getElementById('f-saldo').value    = conta?.saldo || '';
  document.getElementById('f-obs').value      = conta?.observacoes || '';
  // Moeda: a conta guarda a sua; conta nova começa em R$ e a casa sugere (US$ se o cadastro da casa for em dólar)
  document.getElementById('f-moeda').value    = conta?.moeda === 'USD' ? 'USD' : 'BRL';
  moedaTocada = !!conta;
  atualizaLabelSaldo();

  // Populate grupo datalist
  populateGrupoSelectInModal();
  document.getElementById('f-grupo').value = conta?.grupo || grupos[0] || '';

  document.getElementById('btn-delete').style.display = conta ? '' : 'none';
  document.getElementById('modal-conta').classList.add('open');
}

// ── MOEDA DA CONTA ───────────────────────────────────────────────
let moedaTocada = false;           // usuário escolheu a moeda na mão → a casa não sobrescreve
let _moedaPorCasa = {};            // 'THUNDERPICK' → 'USD' (vem do cadastro de bookies do dash principal)
const normCasa = s => normSit(s).replace(/[^A-Z0-9]/g, '');
async function loadMoedasCasas() {
  try {
    const rows = await sbGet('bookies?select=nome,moeda');
    _moedaPorCasa = Object.fromEntries(rows.filter(b => b.moeda).map(b => [normCasa(b.nome), b.moeda]));
  } catch(e) { _moedaPorCasa = {}; }
}
function sugereMoedaDaCasa() {
  if (moedaTocada) return;
  const m = _moedaPorCasa[normCasa(document.getElementById('f-casa').value)];
  // casa que aceita R$ e US$ (ex.: Stake): a conta pode ser de qualquer uma — mantém a escolhida
  if (m !== 'AMBAS') document.getElementById('f-moeda').value = m === 'USD' ? 'USD' : 'BRL';
  atualizaLabelSaldo();
}
function atualizaLabelSaldo() {
  const m = document.getElementById('f-moeda').value;
  document.getElementById('f-saldo-label').textContent = m === 'USD' ? 'Saldo (US$)' : 'Saldo (R$)';
}

function editConta(id) { openModal(allContas.find(c=>c.id===id)); }

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if(e.target===el) el.classList.remove('open'); });
});

async function saveConta() {
  const id = document.getElementById('f-id').value;
  const body = {
    casa:        document.getElementById('f-casa').value.trim().toUpperCase(),
    agente:      document.getElementById('f-agente').value.trim(),
    situacao:    document.getElementById('f-situacao').value,
    login:       document.getElementById('f-login').value.trim(),
    senha:       document.getElementById('f-senha').value.trim(),
    saldo:       parseFloat(document.getElementById('f-saldo').value)||0,
    observacoes: document.getElementById('f-obs').value.trim(),
    grupo:       normGrupo(document.getElementById('f-grupo').value),
    moeda:       document.getElementById('f-moeda').value === 'USD' ? 'USD' : 'BRL',
    atualizado_em:  new Date().toISOString(),
    atualizado_por: currentUser,
  };
  if (!body.casa) { toast('Informe a casa de aposta', 'err'); return; }
  try {
    if (id) {
      const old = allContas.find(c=>c.id===id)||{};
      await sbPatch(`contas?id=eq.${id}`, body);
      // Log changes
      for (const k of ['casa','agente','situacao','login','senha','saldo','moeda','observacoes','grupo']) {
        if (String(old[k]||'') !== String(body[k]||'')) {
          await sbPost('historico_contas', {
            conta_id:id, campo_alterado:k,
            valor_anterior:String(old[k]||''), valor_novo:String(body[k]||''),
            alterado_por:currentUser
          });
        }
      }
      Object.assign(old, body);
    } else {
      body.ordem = allContas.length;
      const r = await fetch(`${SUPA_URL}/rest/v1/contas`, {
        method:'POST', headers:{...headers(true),'Prefer':'return=representation'},
        body:JSON.stringify(body)
      });
      const [nc] = await r.json();
      allContas.push(nc);
    }
    closeModal('modal-conta');
    populateFilters(); renderGroups();
    if (body.grupo !== SEM_GRUPO && !grupos.includes(body.grupo))
      toast(`Conta salva em Sem grupo: o grupo "${body.grupo}" não existe (crie no +)`, 'err');
    else
      toast('Conta salva!', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

// Grupo digitado na conta: vazio → Sem grupo; bate com grupo existente ignorando maiúscula → nome cadastrado
function normGrupo(v) {
  const t = (v||'').trim();
  if (!t || mesmoNome(t, SEM_GRUPO)) return SEM_GRUPO;
  return grupos.find(g => mesmoNome(g, t)) || t;
}

async function confirmDelete(id, casa) {
  if (!confirm(`Excluir a conta "${casa}" permanentemente?`)) return;
  try {
    await sbDelete(`contas?id=eq.${id}`);
    allContas = allContas.filter(c=>c.id!==id);
    populateFilters(); renderGroups();
    toast('Conta excluída', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}
async function deleteConta() {
  const id = document.getElementById('f-id').value;
  if (!id || !confirm('Excluir esta conta permanentemente?')) return;
  try {
    await sbDelete(`contas?id=eq.${id}`);
    allContas = allContas.filter(c=>c.id!==id);
    closeModal('modal-conta');
    populateFilters(); renderGroups();
    toast('Conta excluída', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

async function showHist(id, casa) {
  document.getElementById('hist-conta-name').textContent = casa;

      </div>`).join('');
  } catch(e) { document.getElementById('hist-list').innerHTML=`<div style="color:var(--danger)">${e.message}</div>`; }

function populateGrupoSelectInModal() {

// ── INLINE EDIT ──────────────────────────────────────────────────
function editSituacao(el, id, cur) {
  const inp = document.createElement('input');
  inp.value = cur;
  inp.style.cssText = 'background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;width:110px;outline:none;font-family:var(--sans)';
  el.replaceWith(inp);
  inp.focus(); inp.select();

  async function commit() {
    const val = inp.value.trim() || cur;
    const conta = allContas.find(c=>c.id===id);
    if (conta && val !== cur) {
      try {
        await sbPatch(`contas?id=eq.${id}`, { situacao: val, atualizado_em: new Date().toISOString(), atualizado_por: currentUser });
        await sbPost('historico_contas', { conta_id:id, campo_alterado:'situacao', valor_anterior:cur, valor_novo:val, alterado_por:currentUser });
        conta.situacao = val;
        if (window._idadeSituacoes) window._idadeSituacoes[id] = { ts: new Date().toISOString(), por: currentUser };
        renderGroups();
        toast('Situação atualizada', 'ok');
      } catch(e) { toast('Erro: '+e.message,'err'); renderGroups(); }
    } else { renderGroups(); }
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape') { inp.value=cur; inp.blur(); } });
}

function editObs(el, id, cur) {
  const inp = document.createElement('input');
  inp.value = cur;
  inp.style.cssText = 'background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:3px 8px;border-radius:4px;font-size:12px;width:180px;outline:none;font-family:var(--sans)';
  el.replaceWith(inp);
  inp.focus(); inp.select();

  async function commit() {
    const val = inp.value.trim();
    const conta = allContas.find(c=>c.id===id);
    if (conta && val !== cur) {
      try {
        await sbPatch(`contas?id=eq.${id}`, { observacoes: val, atualizado_em: new Date().toISOString(), atualizado_por: currentUser });
        await sbPost('historico_contas', { conta_id:id, campo_alterado:'observacoes', valor_anterior:cur, valor_novo:val, alterado_por:currentUser });
        conta.observacoes = val;
        renderGroups();
        toast('Obs atualizada', 'ok');
      } catch(e) { toast('Erro: '+e.message,'err'); renderGroups(); }
    } else { renderGroups(); }
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape') { inp.value=cur; inp.blur(); } });
}

function editSaldo(el, id, cur) {
  const inp = document.createElement('input');
  inp.type = 'number'; inp.step = '0.01';
  inp.value = cur;
  inp.style.cssText = 'background:var(--surface2);border:1px solid var(--accent);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:13px;width:110px;outline:none;font-family:var(--mono)';
  el.replaceWith(inp);
  inp.focus(); inp.select();

  async function commit() {
    const val = parseFloat(inp.value) || 0;
    const conta = allContas.find(c=>c.id===id);
    if (conta && val !== cur) {
      try {
        await sbPatch(`contas?id=eq.${id}`, { saldo: val, atualizado_em: new Date().toISOString(), atualizado_por: currentUser });
        await sbPost('historico_contas', { conta_id:id, campo_alterado:'saldo', valor_anterior:String(cur), valor_novo:String(val), alterado_por:currentUser });
        conta.saldo = val;
        if (window._idadeSaldos) window._idadeSaldos[id] = { ts: new Date().toISOString(), por: currentUser };
        renderGroups();
        toast('Saldo atualizado', 'ok');
      } catch(e) { toast('Erro: '+e.message,'err'); renderGroups(); }
    } else { renderGroups(); }
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape') { inp.value=cur; inp.blur(); } });
}

// ── UTILS ─────────────────────────────────────────────────────────
function togglePwd(id, val) {
  event.stopPropagation();
  const el = document.getElementById('pwd-'+id);
  el.textContent = el.textContent==='••••••' ? val : '••••••';
}

function copyTxt(e, val) {
  e.stopPropagation();
  if (!val) { toast('Vazio', 'err'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(
      () => toast('Copiado!', 'ok'),
      () => fallbackCopy(val)
    );
  } else {
    fallbackCopy(val);
  }
}

function fallbackCopy(val) {
  const ta = document.createElement('textarea');
  ta.value = val; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copiado!', 'ok'); }
  catch(e) { toast('Erro ao copiar', 'err'); }
  document.body.removeChild(ta);
}

let toastTimer;
function toast(msg, type='ok', ms=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.className='toast', ms);
}

// ── OPERAÇÃO: escala, horas, pendências e custo ───────────────────
// Lê e grava com a chave de serviço (tabelas novas não ficam abertas pro anon).
const TZ = 'America/Sao_Paulo';
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const hsvc = (extra={}) => ({ 'Content-Type':'application/json', apikey: SVC_KEY, Authorization: `Bearer ${SVC_KEY}`, ...extra });
async function opApi(method, path, body, prefer) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method, headers: hsvc(prefer ? { Prefer: prefer } : {}), body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
let opModo = 'semana', opRef = null, opDados = null;
const isSamuel = () => currentUser === 'Samuel';
function hojeBRT() { return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function addDias(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function periodoOp() {
  if (opModo === 'mes') {
    const [y, m] = opRef.split('-').map(Number);
    return [`${y}-${String(m).padStart(2,'0')}-01`, new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)];
  }
  const dow = (new Date(opRef + 'T12:00:00Z').getUTCDay() + 6) % 7;
  const ini = addDias(opRef, -dow);
  return [ini, addDias(ini, 6)];
}
function navOp(dir) {
  if (opModo === 'mes') { const [y, m] = opRef.split('-').map(Number); opRef = new Date(Date.UTC(y, m - 1 + dir, 15)).toISOString().slice(0, 10); }
  else opRef = addDias(opRef, 7 * dir);
  renderOperacao();
}
function setOpModo(m) { opModo = m; renderOperacao(); }
function fmtDur(h) { const m = Math.round((+h || 0) * 60); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; }
function diaBR(iso) { const d = new Date(iso + 'T12:00:00Z'); return `${DIAS[d.getUTCDay()]} ${iso.slice(8,10)}/${iso.slice(5,7)}`; }
function horaBRT(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }); }
function dataHoraBRT(ts) { const d = new Date(ts); return d.toLocaleDateString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit' }) + ' ' + horaBRT(ts); }
function brlOp(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function usdOp(v) { return 'US$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plural(n, s, p) { return `${n} ${n === 1 ? s : p}`; }
// "09/10/2026 18:05" ou "09/10 18:05" (ano do período) → ISO com fuso de Brasília
function parseDataHoraBR(txt, anoPadrao) {
  const m = (txt || '').trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\s+(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const [, d, mo, a, h, mi] = m;
  return `${a || anoPadrao}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}T${h.padStart(2,'0')}:${mi}:00-03:00`;
}

async function renderOperacao() {
  if (!opRef) opRef = hojeBRT();
  const root = document.getElementById('op-root');
  const [de, ate] = periodoOp();
  const titulo = opModo === 'mes'
    ? new Date(de + 'T12:00:00Z').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' })
    : `${diaBR(de)} a ${diaBR(ate)}`;
  const head = `
    <div class="op-head">
      <button class="op-btn" onclick="navOp(-1)" aria-label="Período anterior">‹</button>
      <div class="op-periodo">${titulo}</div>
      <button class="op-btn" onclick="navOp(1)" aria-label="Próximo período">›</button>
      <div class="op-seg" role="group" aria-label="Período">
        <button class="op-btn ${opModo === 'semana' ? 'on' : ''}" onclick="setOpModo('semana')">Semana</button>
        <button class="op-btn ${opModo === 'mes' ? 'on' : ''}" onclick="setOpModo('mes')">Mês</button>
      </div>
      <button class="op-btn" onclick="opRef = hojeBRT(); renderOperacao()">Hoje</button>
      <button class="op-btn" onclick="renderOperacao()">Atualizar</button>
    </div>`;
  root.innerHTML = head + '<div class="op-vazio">Carregando…</div>';
  try {
    opDados = await opApi('POST', 'rpc/painel_operadores', { p_de: de, p_ate: ate });
  } catch (e) {
    root.innerHTML = head + `<div class="op-vazio">Erro ao carregar: ${esc(e.message)}</div>`;
    return;
  }
  const todos = (opDados.operadores || []);
  const visiveis = isSamuel() ? todos : todos.filter(o => o.nome === currentUser);
  const regs = (opDados.registros || []).filter(r => isSamuel() || r.operador === currentUser);

  root.innerHTML = head
    + `<div class="op-grid">${visiveis.map(cardOperador).join('') || '<div class="op-vazio">Nada registrado neste período.</div>'}${isSamuel() && visiveis.length > 1 ? cardTotal(visiveis) : ''}</div>`
    + secaoEscala(opDados.escala || [], todos)
    + secaoRegistros(regs, todos);
}

function cardOperador(o) {
  const pct = o.horas_previstas > 0 ? Math.min(100, Math.round(100 * o.horas / o.horas_previstas)) : 0;
  const pendIds = (o.pend_prints_ids || []).slice(0, 6).map(i => '#' + i).join(', ');
  const linhas = [
    ['Prints', o.prints ? `${o.prints} · ` + ([[o.prints_aviso, 'com aviso'], [o.prints_sem_aposta, 'sem aposta'], [o.prints_erro, 'erro'], [o.prints_repetido, 'repetido']]
      .filter(([n]) => +n).map(([n, t]) => `${n} ${t}`).join(' · ') || 'todos ok') : '0'],
    ['Correções pelo bot', o.corrigidos],
    ['Apostas registradas', o.entradas],
  ];
  let html = `<div class="op-card">
    <div class="op-card-top"><span class="op-nome">${esc(o.nome)}</span>${o.abertos ? '<span class="op-aberto">entrada aberta</span>' : ''}</div>
    <div class="op-horas">${fmtDur(o.horas)} <small>de ${fmtDur(o.horas_previstas)} previstas</small></div>
    <div class="op-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
    ${linhas.map(([k, v]) => `<div class="op-linha"><span>${k}</span><b>${v}</b></div>`).join('')}
    <div class="op-linha"><span>Pendente agora</span><b class="${o.pend_prints || o.penduradas ? 'op-pend' : ''}">${
      (o.pend_prints || o.penduradas)
        ? [o.pend_prints ? `${plural(o.pend_prints, 'print com aviso', 'prints com aviso')} (${pendIds})` : '', o.penduradas ? plural(o.penduradas, 'aposta pendurada', 'apostas penduradas') : ''].filter(Boolean).join(' · ')
        : 'nada'}</b></div>`;
  if (isSamuel()) {
    html += `
    <div class="op-linha"><span>Atividade no tempo registrado</span><b>${o.atividade_pct == null ? '—' : o.atividade_pct + '%'}</b></div>
    <div class="op-linha"><span>Prints fora do registro</span><b>${o.prints_fora_registro}</b></div>
    <div class="op-linha"><span>Saídas fechadas pelo bot</span><b>${o.fechamentos_auto}</b></div>
    <div class="op-linha"><span>Horas × ${brlOp(o.valor_hora)}</span><b>${brlOp(o.custo_horas)}</b></div>
    <div class="op-linha"><span>Comissão ${String(o.comissao_pct).replace('.', ',')}% de ${brlOp(o.faturamento_r)}</span><b>${brlOp(o.comissao_r)}</b></div>
    ${(+o.faturamento_usd || +o.comissao_usd) ? `<div class="op-linha"><span>Comissão em dólar (de ${usdOp(o.faturamento_usd)})</span><b>${usdOp(o.comissao_usd)}</b></div>` : ''}
    <div class="op-linha total"><span>Total em reais</span><b>${brlOp(o.total_r)}</b></div>`;
  }
  return html + '</div>';
}

function cardTotal(lista) {
  const soma = k => lista.reduce((s, o) => s + (+o[k] || 0), 0);
  const usd = soma('comissao_usd');
  return `<div class="op-card">
    <div class="op-card-top"><span class="op-nome">Operação</span></div>
    <div class="op-horas">${fmtDur(soma('horas'))} <small>de ${fmtDur(soma('horas_previstas'))} previstas</small></div>
    <div class="op-bar"><div style="width:${soma('horas_previstas') > 0 ? Math.min(100, Math.round(100 * soma('horas') / soma('horas_previstas'))) : 0}%"></div></div>
    <div class="op-linha"><span>Horas</span><b>${brlOp(soma('custo_horas'))}</b></div>
    <div class="op-linha"><span>Comissões</span><b>${brlOp(soma('comissao_r'))}</b></div>
    ${usd ? `<div class="op-linha"><span>Comissões em dólar</span><b>${usdOp(usd)}</b></div>` : ''}
    <div class="op-linha total"><span>Custo dos operadores</span><b>${brlOp(soma('total_r'))}</b></div>
  </div>`;
}

function secaoEscala(escala, ops) {
  const porDia = {};
  escala.forEach(e => { (porDia[e.data] = porDia[e.data] || []).push(e); });
  const dias = Object.keys(porDia).sort();
  const linhas = dias.map(d => {
    const es = porDia[d];
    const janela = [...new Set(es.map(e => `${e.janela_inicio}–${e.janela_fim}`))].join(' / ');
    const quem = es.map(e => `${esc(e.operador)} ${fmtDur(e.horas_previstas)}`).join(' · ');
    const obs = es.map(e => e.obs).filter(Boolean).join(' · ');
    return `<tr><td class="mono">${diaBR(d)}</td><td class="mono">${janela}</td><td>${quem}</td><td style="color:var(--text2)">${esc(obs)}</td>
      ${isSamuel() ? `<td><div class="op-acoes"><button class="op-btn" onclick="editarDiaEscala('${d}')">Editar</button><button class="op-btn perigo" onclick="apagarDiaEscala('${d}')">Tirar</button></div></td>` : ''}</tr>`;
  }).join('');
  const total = escala.reduce((s, e) => s + (+e.horas_previstas || 0), 0);
  let html = `<div class="op-sec">Escala${total ? ` · ${fmtDur(total)} previstas` : ''}</div>`;
  html += dias.length
    ? `<table class="op-table"><thead><tr><th>Dia</th><th>Janela</th><th>Horas por operador</th><th>Obs</th>${isSamuel() ? '<th></th>' : ''}</tr></thead><tbody>${linhas}</tbody></table>`
    : '<div class="op-vazio">Sem escala neste período.</div>';
  if (isSamuel()) {
    const operadores = ops.filter(o => o.nome !== 'Samuel');
    html += `<form class="op-form" id="form-escala" onsubmit="salvarDiaEscala(event)">
      <label>Dia<input type="date" id="esc-data" required></label>
      <label>Janela de<input type="time" id="esc-ini" value="18:00" required></label>
      <label>até<input type="time" id="esc-fim" value="22:00" required></label>
      ${operadores.map(o => `<label>${esc(o.nome)} (h)<input type="number" min="0" max="16" step="0.5" data-op="${o.id}" class="esc-horas" value="0"></label>`).join('')}
      <label style="flex:1;min-width:140px">Obs<input type="text" id="esc-obs" placeholder="opcional"></label>
      <button class="op-btn on" type="submit">Salvar dia</button>
    </form>`;
  }
  return html;
}

function editarDiaEscala(d) {
  const es = (opDados.escala || []).filter(e => e.data === d);
  if (!es.length) return;
  document.getElementById('esc-data').value = d;
  document.getElementById('esc-ini').value = es[0].janela_inicio;
  document.getElementById('esc-fim').value = es[0].janela_fim;
  document.getElementById('esc-obs').value = es.find(e => e.obs)?.obs || '';
  document.querySelectorAll('.esc-horas').forEach(inp => {
    const e = es.find(x => x.operador_id === inp.dataset.op);
    inp.value = e ? e.horas_previstas : 0;
  });
  document.getElementById('form-escala').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function salvarDiaEscala(ev) {
  ev.preventDefault();
  const data = document.getElementById('esc-data').value;
  const ini = document.getElementById('esc-ini').value, fim = document.getElementById('esc-fim').value;
  const obs = document.getElementById('esc-obs').value.trim() || null;
  if (!data || !ini || !fim) return;
  if (fim <= ini) { toast('O fim da janela tem que ser depois do início', 'err'); return; }
  const horasJanela = (Date.parse(`2000-01-01T${fim}`) - Date.parse(`2000-01-01T${ini}`)) / 3600000;
  const linhas = [], zerar = [];
  document.querySelectorAll('.esc-horas').forEach(inp => {
    const h = parseFloat(inp.value) || 0;
    if (h > 0) linhas.push({ data, operador_id: inp.dataset.op, janela_inicio: ini, janela_fim: fim, horas_previstas: h, obs, criado_por: currentUser });
    else zerar.push(inp.dataset.op);
  });
  if (linhas.some(l => l.horas_previstas > horasJanela)) { toast(`Mais horas que a janela (${fmtDur(horasJanela)})`, 'err'); return; }
  try {
    if (linhas.length) await opApi('POST', 'escala?on_conflict=data,operador_id', linhas, 'resolution=merge-duplicates,return=minimal');
    for (const op of zerar) await opApi('DELETE', `escala?data=eq.${data}&operador_id=eq.${op}`);
    toast('Escala salva', 'ok');
    opRef = data;
    renderOperacao();
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

async function apagarDiaEscala(d) {
  if (!confirm(`Tirar ${diaBR(d)} da escala?`)) return;
  try { await opApi('DELETE', `escala?data=eq.${d}`); toast('Dia removido da escala', 'ok'); renderOperacao(); }
  catch (e) { toast('Erro: ' + e.message, 'err'); }
}

function secaoRegistros(regs, ops) {
  let html = `<div class="op-sec">Entradas e saídas</div>`;
  html += regs.length ? `<table class="op-table"><thead><tr><th>Operador</th><th>Entrada</th><th>Saída</th><th>Tempo</th><th>Obs</th>${isSamuel() ? '<th></th>' : ''}</tr></thead><tbody>${
    regs.map(r => `<tr>
      <td>${esc(r.operador)}</td>
      <td class="mono">${dataHoraBRT(r.inicio)}</td>
      <td class="mono">${r.fim ? dataHoraBRT(r.fim) : '<span class="op-flag">aberta</span>'}</td>
      <td class="mono">${fmtDur(r.horas)}</td>
      <td style="color:var(--text2);font-size:12px">${[
        r.fim_auto ? '<span class="op-flag">fechada pelo bot</span>' : '',
        ({ dash: 'pelo botão do dash', manual: 'lançada à mão' })[r.origem] || (r.origem && r.origem !== 'telegram' ? esc(r.origem) : ''),
        r.ajustado_por ? 'ajustada por ' + esc(r.ajustado_por) : '',
        r.obs && !r.fim_auto ? esc(r.obs) : ''].filter(Boolean).join(' · ')}</td>
      ${isSamuel() ? `<td><div class="op-acoes"><button class="op-btn" onclick="ajustarRegistro('${r.id}')">Ajustar</button><button class="op-btn perigo" onclick="apagarRegistro('${r.id}')">Apagar</button></div></td>` : ''}
    </tr>`).join('')}</tbody></table>` : '<div class="op-vazio">Nenhuma entrada registrada neste período.</div>';
  if (isSamuel()) {
    const operadores = ops.filter(o => o.nome !== 'Samuel');
    html += `<form class="op-form" onsubmit="registroManual(event)">
      <label>Operador<select id="reg-op">${operadores.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('')}</select></label>
      <label>Dia<input type="date" id="reg-data" required></label>
      <label>Entrada<input type="time" id="reg-ini" required></label>
      <label>Saída<input type="time" id="reg-fim" required></label>
      <button class="op-btn on" type="submit">Lançar à mão</button>
    </form>`;
  }
  return html;
}

async function ajustarRegistro(id) {
  const r = (opDados.registros || []).find(x => x.id === id);
  if (!r) return;
  const ano = r.inicio.slice(0, 4);
  const ini = prompt(`Entrada de ${r.operador} (dd/mm hh:mm)`, dataHoraBRT(r.inicio));
  if (ini === null) return;
  const fim = prompt(`Saída de ${r.operador} (dd/mm hh:mm) — vazio deixa aberta`, r.fim ? dataHoraBRT(r.fim) : '');
  if (fim === null) return;
  const iIso = parseDataHoraBR(ini, ano), fIso = fim.trim() ? parseDataHoraBR(fim, ano) : null;
  if (!iIso || (fim.trim() && !fIso)) { toast('Use o formato dd/mm hh:mm', 'err'); return; }
  if (fIso && Date.parse(fIso) < Date.parse(iIso)) { toast('Saída antes da entrada', 'err'); return; }
  try {
    await opApi('PATCH', `registro_horas?id=eq.${id}`, { inicio: iIso, fim: fIso, fim_auto: false, ajustado_por: currentUser, ajustado_em: new Date().toISOString() }, 'return=minimal');
    toast('Registro ajustado', 'ok'); renderOperacao();
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

async function apagarRegistro(id) {
  const r = (opDados.registros || []).find(x => x.id === id);
  if (!r || !confirm(`Apagar a entrada de ${r.operador} de ${dataHoraBRT(r.inicio)} (${fmtDur(r.horas)})?`)) return;
  try { await opApi('DELETE', `registro_horas?id=eq.${id}`); toast('Registro apagado', 'ok'); renderOperacao(); }
  catch (e) { toast('Erro: ' + e.message, 'err'); }
}

async function registroManual(ev) {
  ev.preventDefault();
  const op = document.getElementById('reg-op').value, d = document.getElementById('reg-data').value;
  const ini = document.getElementById('reg-ini').value, fim = document.getElementById('reg-fim').value;
  if (!op || !d || !ini || !fim) return;
  if (fim <= ini) { toast('Saída tem que ser depois da entrada', 'err'); return; }
  try {
    await opApi('POST', 'registro_horas', { operador_id: op, inicio: `${d}T${ini}:00-03:00`, fim: `${d}T${fim}:00-03:00`, origem: 'manual', ajustado_por: currentUser, ajustado_em: new Date().toISOString() }, 'return=minimal');
    toast('Registro lançado', 'ok'); opRef = d; renderOperacao();
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}


// ── TURNO: botão Iniciar/Encerrar no topo (bate o ponto com a hora do servidor;
//    o bot de prints avisa no RM Office - Chat). Só pra quem é pago por hora.
let turno = null, turnoTimer = null, turnoPendEm = 0;
async function iniciarTurno() {
  pararTurno();
  await atualizarTurno(true);
  turnoTimer = setInterval(() => atualizarTurno(Date.now() - turnoPendEm > 300000), 60000);
}
function pararTurno() {
  clearInterval(turnoTimer); turnoTimer = null; turno = null;
  const b = document.getElementById('btn-turno'); b.hidden = true; b.disabled = false;
  const p = document.getElementById('pend-bar'); p.hidden = true; p.innerHTML = '';
}
async function atualizarTurno(comPendencias) {
  if (!currentUser) return;
  try { turno = await opApi('POST', 'rpc/bater_ponto', { p_operador: currentUser, p_acao: 'status' }); }
  catch (e) { console.error('turno:', e); return; }
  const b = document.getElementById('btn-turno');
  if (!turno || !turno.ok || !turno.por_hora) { b.hidden = true; document.getElementById('pend-bar').hidden = true; return; }
  b.hidden = false;
  pintarTurno();
  if (comPendencias) atualizarPendencias();
}
function pintarTurno() {
  const b = document.getElementById('btn-turno');
  const ab = turno && turno.aberto;
  b.classList.toggle('on', !!ab);
  b.textContent = ab ? `Encerrar turno · ${fmtDur((Date.now() - Date.parse(ab.inicio)) / 3600000)}` : 'Iniciar turno';
  b.title = ab ? `Turno aberto desde ${horaBRT(ab.inicio)}` : 'Marca a entrada e avisa no RM Office - Chat';
}
async function atualizarPendencias() {
  turnoPendEm = Date.now();
  const bar = document.getElementById('pend-bar');
  try {
    const d = await opApi('POST', 'rpc/painel_operadores', { p_de: hojeBRT(), p_ate: hojeBRT() });
    const o = (d.operadores || []).find(x => x.nome === currentUser);
    const itens = [];
    if (o && o.pend_prints) itens.push(`${plural(o.pend_prints, 'print com aviso sem correção', 'prints com aviso sem correção')} (${(o.pend_prints_ids || []).slice(0, 5).map(i => '#' + i).join(', ')})`);
    if (o && o.penduradas) itens.push(`${plural(o.penduradas, 'aposta com evento encerrado', 'apostas com evento encerrado')} pra resolver`);
    bar.innerHTML = itens.length ? `<b>Pendente:</b> ${itens.map(esc).join(' · ')}` : '';
    bar.hidden = !itens.length;
  } catch (e) { console.error('pendências:', e); }
}
async function turnoClick() {
  if (!turno || !turno.ok) return;
  const ab = turno.aberto, esc_ = turno.escala_hoje;
  const pergunta = ab
    ? `Encerrar o turno? ${fmtDur((Date.now() - Date.parse(ab.inicio)) / 3600000)} desde ${horaBRT(ab.inicio)}.`
    : 'Iniciar o turno agora?\n' + (esc_ ? `Escala de hoje: ${esc_.janela_inicio}–${esc_.janela_fim} (${fmtDur(esc_.horas_previstas)}).` : 'Você não está na escala de hoje.');
  if (!confirm(pergunta)) return;
  const b = document.getElementById('btn-turno');
  b.disabled = true;
  try {
    const r = await opApi('POST', 'rpc/bater_ponto', { p_operador: currentUser, p_acao: ab ? 'saida' : 'entrada' });
    if (!r.ok) toast({ ja_aberto: 'Você já está com turno aberto', sem_entrada: 'Não achei turno aberto' }[r.motivo] || 'Não deu: ' + r.motivo, 'err');
    else if (r.acao === 'entrada') toast(`Turno iniciado às ${horaBRT(r.inicio)}. Confere os saldos das casas principais.`, 'ok', 7000);
    else toast(`Turno encerrado: ${fmtDur(r.horas)}`, 'ok', 5000);
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
  b.disabled = false;
  await atualizarTurno(true);
  if (!document.getElementById('view-operacao').hidden) renderOperacao();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && turnoTimer) atualizarTurno(false); });

// Auto-login se sessão salva
(async function() {
  const saved = localStorage.getItem('me_user');
  if (saved) {
    currentUser = saved;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('disp-user').textContent = currentUser;
    await loadGrupos();
    init();
    iniciarTurno();
    try { if (localStorage.getItem('me_view') === 'operacao') setView('operacao'); } catch(e) {}
  }
})();
</script>
